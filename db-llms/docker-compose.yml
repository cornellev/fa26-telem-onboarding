services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cev
      POSTGRES_PASSWORD: cev
      POSTGRES_DB: telemetry
    ports:
      # Set DB_PORT in .env if 5432 is already taken on your laptop
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U cev -d telemetry"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
